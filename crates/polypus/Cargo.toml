[package]
name = "polypus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust-core quantum variational optimization framework with a Python (PyO3) interface: circuit simulation, VQC/QML training and population-based optimizers (DE, PSO, QNG). Python users: `pip install polypus-quantum` (the module imports as `polypus`)."
# crates.io landing metadata. The Rust crate is `polypus`; the same project on
# PyPI is the `polypus-quantum` distribution (which imports as `polypus`), so a
# reader arriving from either side can find the other — see the Homepage/README.
homepage = "https://github.com/Bahia-Software/polypus"
documentation = "https://bahia-software.github.io/polypus/"
keywords = ["quantum", "simulator", "qaoa", "optimization", "pyo3"]
categories = ["science", "simulation"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "polypus"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]
# Real CESGA QMIO QPU backend. Opt-in so the default build never pulls a ZeroMQ
# stack. The backend itself (ZeroMQ wire protocol, pickle serialisation) lives in
# `polypus-infrastructure`; this just forwards the feature to it.
qmio = ["polypus-infrastructure/qmio"]
default = ["info-logs"]
# Compile-time max log level, forwarded to the shared `polypus-logger` crate
# (which in turn toggles the `log` crate's global `max_level_*` features).
off-logs   = ["polypus-logger/off-logs"]
error-logs = ["polypus-logger/error-logs"]
warn-logs  = ["polypus-logger/warn-logs"]
info-logs  = ["polypus-logger/info-logs"]
debug-logs = ["polypus-logger/debug-logs"]
trace-logs = ["polypus-logger/trace-logs"]

[dependencies]
polypus-circuit = { workspace = true }
polypus-sim = { workspace = true, features = ["parallel"] }
polypus-optimizers = { workspace = true }
polypus-observable = { workspace = true }
polypus-infrastructure = { workspace = true }
polypus-orchestration = { workspace = true }
polypus-evaluation = { workspace = true }
polypus-logger = { workspace = true }
# Was 0.24.2; moved to 0.25 only to unblock `numpy` below (rust-numpy versions
# are pinned 1:1 to a pyo3 version, and 0.24 is unusable — see the note there).
# The bump needs no source changes and clears neither of the pyo3 advisories
# ignored in `deny.toml`; those still want >=0.26 / >=0.29.
pyo3 = { version = "0.25", features = ["num-complex"] }
# Zero-copy handover of the `2^n` statevector amplitudes to Python as a
# `numpy.ndarray` of `complex128` (see `bindings::circuit::statevector`). Must
# stay >= 0.25: rust-numpy 0.24.0 still carries the deprecated
# `ToPyArray::to_pyarray_bound`, whose doc link makes rustdoc ICE on current
# stable (1.96) and so breaks `cargo doc -D warnings` in CI. 0.25 removed it.
numpy = "0.25"
log = { workspace = true }
uuid = { workspace = true }
# Only for `rayon::current_num_threads()` in the calibration warning message
# (crates/polypus/src/bindings/calibration.rs); the actual parallel kernels
# live in polypus-sim/polypus-infrastructure, which depend on it themselves.
rayon = "1"