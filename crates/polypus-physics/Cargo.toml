[package]
name              = "polypus-physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description       = "Pure-Rust physics layer for Polypus: classical Monte Carlo transport, and quantum Hamiltonians as multi-qubit Pauli sums, with fermion-to-qubit mappings, exact diagonalization and molecular Hamiltonians (H2, STO-3G). No Python, no external physics framework."
# Example outputs are regenerated by `examples/photon_100kvp_water.rs`; the
# fonts in `assets/` stay, `src/fonts.rs` embeds them.
exclude = ["examples/plots/", "examples/results/"]

[lib]
name = "polypus_physics"

[dependencies]
rand    = { workspace = true, features = ["std_rng"] }
serde   = { workspace = true, optional = true }
# Logging *facade* only (no sink): Monte Carlo run diagnostics are emitted
# through `log::*!` and stay no-ops until the app layer installs a logger. This
# crate never depends on `polypus-logger`.
log     = { workspace = true }
# `erf` for the Boys function of the STO-3G integrals (`chemistry::sto3g`).
libm    = { workspace = true }
csv = { version = "1", optional = true }
plotters = { version = "0.3.7", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "line_series",
    "ab_glyph",
], optional = true }

[features]
default = []
serde     = ["dep:serde"]
csv-export = ["dep:csv", "dep:serde"]
plotters = ["dep:plotters"]
