[package]
name              = "polypus-physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description       = "Pure-Rust particle-physics simulation layer for Polypus: classical Monte Carlo transport and quantum Hamiltonian definitions as Pauli sums. No Python, no external physics framework."

[lib]
name = "polypus_physics"

[dependencies]
rand    = { version = "0.8", features = ["std_rng"] }
ndarray = "0.16"
serde   = { version = "1.0", features = ["derive"], optional = true }
# Logging *facade* only (no sink): Monte Carlo run diagnostics are emitted
# through `log::*!` and stay no-ops until the app layer installs a logger. This
# crate never depends on `polypus-logger`.
log     = { workspace = true }
include_dir = "0.7.4"
csv = { version = "1", optional = true }
plotters = { version = "0.3.7", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "line_series",
    "ab_glyph",
], optional = true }

[features]
default = []
serde     = ["dep:serde"]
csv-export = ["dep:csv", "dep:serde"]
plotters = ["dep:plotters"]
