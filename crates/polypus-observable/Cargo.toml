[package]
name              = "polypus-observable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description       = "Pure-Rust diagonal cost observables (QUBO/Ising) mapping measurement counts to expectation values. rayon-parallel over candidates, GIL-free. No Python."

[lib]
name = "polypus_observable"

[dependencies]
# The crate's raison d'être is GIL-free parallel aggregation over the whole
# candidate population, which always pays off — so rayon is a required (not
# feature-gated) dependency, unlike polypus-sim's opt-in gate kernels.
rayon = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
