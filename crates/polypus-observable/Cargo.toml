[package]
name              = "polypus-observable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description       = "Pure-Rust cost observables mapping measurement counts to expectation values: diagonal QUBO/Ising costs, and Pauli sums through qubit-wise-commuting grouping and a parity reducer. rayon-parallel over candidates, GIL-free. No Python."

[lib]
name = "polypus_observable"

[dependencies]
# The crate's raison d'être is GIL-free parallel aggregation over the whole
# candidate population, which always pays off — so rayon is a required (not
# feature-gated) dependency, unlike polypus-sim's opt-in gate kernels.
rayon = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
# Only for the Pauli-sum acceptance tests (tests/pauli_sum.rs, issue #530): the
# 4-qubit H2 Hamiltonian, and a simulated state to measure it on. The library
# itself does not depend on them.
polypus-circuit = { workspace = true }
polypus-physics = { workspace = true }
polypus-sim = { workspace = true }

[lints]
workspace = true
