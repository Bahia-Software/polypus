# cargo-deny configuration for Polypus.
#
# Run with:  cargo deny check
# Schema note: cargo-deny's config format drifts between releases. This targets
# a recent (v0.16+/v2) schema. If your version rejects a key, run
# `cargo deny --version` and remove/adjust the offending field.

[advisories]
# Uses the RustSec advisory database (https://github.com/rustsec/advisory-db).
# Recent cargo-deny versions default vulnerabilities to "deny" and unmaintained
# crates to "warn", so no explicit severity keys are needed here.
ignore = [
    # ttf-parser is unmaintained (advisory marks no patched version; the
    # suggested replacement is skrifa). It arrives only through
    # polypus-physics' optional `plotters` feature:
    # plotters 0.3.7 -> ab_glyph 0.2.32 -> owned_ttf_parser 0.25 -> ttf-parser.
    # Re-verified 2026-09-28: those are the latest releases of plotters and
    # ab_glyph, and both still depend on ttf-parser, so no upgrade removes it.
    # Exposure is limited to parsing the two DejaVu fonts embedded with
    # `include_bytes!` in polypus-physics/src/fonts.rs, never external input,
    # and no other workspace crate depends on polypus-physics, so it is absent
    # from the Python extension. Revisit when ab_glyph or plotters moves to a
    # maintained parser.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no patched version; only parses trusted fonts embedded in polypus-physics (optional plotters feature); latest plotters/ab_glyph still depend on it" },
]

[licenses]
# Polypus is licensed under EUPL-1.2. Allow it plus the common permissive
# licenses present across the dependency tree. Add licenses as `cargo deny`
# flags them; don't blanket-allow copyleft without a deliberate decision.
allow = [
    "EUPL-1.2",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # Public-domain equivalent (OSI approved). Pulled in by win_uds, a
    # Windows-only dep of zeromq behind the qmio feature (the CI deny job
    # checks --all-features, which includes it).
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions and wildcard deps are worth a warning, not a hard failure,
# for a fast-moving library. Tighten to "deny" once the tree stabilizes.
multiple-versions = "warn"
wildcards = "warn"
# Workspace boundaries (docs/ENGINEERING.md §2): pyo3 stays out of the pure crates.
# `wrappers` lists the only crates allowed to depend on each entry DIRECTLY. The
# entries cover every crate in the graph that links Python: `pyo3-ffi`, `pyo3`,
# the direct dependents of `pyo3` (`numpy`, `polypus`, `polypus-evaluation`,
# `polypus-infrastructure`) and `polypus-orchestration`, which links it only
# transitively. So a pure crate cannot pull `pyo3` in, either by naming it or
# through any crate that links it. Keep these lists in step with §2 when a crate
# is added or a boundary moves.
#
# The `polypus` entry means "nothing may depend on the PyO3 edge". cargo-deny
# reads an empty `wrappers` as "banned everywhere", which would ban `polypus`
# itself, so the list names the crate itself: a crate never depends on itself,
# so no other crate is allowed. cargo-deny therefore reports this entry as
# `warning[unused-wrapper]` on every run. That warning is expected: do not
# "fix" it by removing the wrapper or the entry.
deny = [
    { crate = "pyo3-ffi", wrappers = ["pyo3"], reason = "links libpython; only pyo3 may wrap it (docs/ENGINEERING.md §2)" },
    { crate = "pyo3", wrappers = ["numpy", "polypus", "polypus-evaluation", "polypus-infrastructure"], reason = "only the PyO3-touching crates may link Python; the rest are pure Rust (docs/ENGINEERING.md §2)" },
    { crate = "numpy", wrappers = ["polypus"], reason = "links pyo3; only the polypus edge converts arrays (docs/ENGINEERING.md §2)" },
    { crate = "polypus", wrappers = ["polypus"], reason = "the PyO3 edge; no crate may depend on it (docs/ENGINEERING.md §2)" },
    { crate = "polypus-infrastructure", wrappers = ["polypus", "polypus-evaluation", "polypus-orchestration"], reason = "links pyo3; a pure crate depending on it would pull pyo3 transitively (docs/ENGINEERING.md §2)" },
    { crate = "polypus-orchestration", wrappers = ["polypus", "polypus-evaluation"], reason = "links pyo3 transitively through polypus-infrastructure (docs/ENGINEERING.md §2)" },
    { crate = "polypus-evaluation", wrappers = ["polypus"], reason = "links pyo3; only the polypus edge assembles it (docs/ENGINEERING.md §2)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]