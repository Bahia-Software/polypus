# mypy configuration for `python -m mypy.stubtest polypus` (see
# docs/CONTRIBUTING.md); it only affects that check.
[mypy]

# The stubs reference `qiskit.QuantumCircuit` and `qiskit_aer.noise.NoiseModel`,
# but neither package ships type information (no `py.typed`, no stubs), so mypy
# refuses to build the stubs at all. Following their untyped source instead
# (`follow_untyped_imports`) crashes mypy inside Qiskit. Treat the two packages
# as opaque: every polypus signature is still checked against the extension.
[mypy-qiskit.*,qiskit_aer.*]
ignore_missing_imports = True

# `polypus.ask_tell` imports `optuna.trial` inside the method that needs it
# (Optuna is not a dependency), so mypy must not require Optuna to be installed.
[mypy-optuna.*]
ignore_missing_imports = True
