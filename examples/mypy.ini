# mypy configuration for type-checking the examples against the stubs the
# wheel ships (python/polypus/*.pyi). .github/workflows/examples.yml runs
#
#     mypy --config-file examples/mypy.ini examples
#
# from the repository root, with the wheel and requirements-examples.txt
# installed.
[mypy]
# The oldest Python Polypus supports (requires-python in pyproject.toml).
python_version = 3.10
# Most example code sits in functions without annotations, whose bodies mypy
# skips by default.
check_untyped_defs = True

# Packages without type information: Qiskit, Aer, SciPy and networkx publish
# none, the bundled polypus_python helpers have no py.typed, and cunqa and
# qmiotools exist only on CESGA's systems. polypus must never be listed here:
# the check is only meaningful while its stubs are found.
[mypy-qiskit.*,qiskit_aer.*,scipy.*,networkx.*,polypus_python.*,cunqa.*,qmiotools.*]
ignore_missing_imports = True
