<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="One polypus.train run: the optimizer proposes a population of candidates (polypus-optimizers); one circuit per candidate is bound in Rust without the GIL (polypus-circuit); the planner splits them across n_qpus (polypus-backend); the QPUs run their share in parallel on Aer, the native simulator, CUNQA or QMIO (polypus-infrastructure, polypus-sim); counts become costs (polypus-observable) and go back to the optimizer. polypus-orchestration drives the loop and the best parameters return to Python"><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.t{font-size:15px;font-weight:600}.s{font-size:12.5px;fill:#59636e}
.k{font-size:10.5px;font-weight:700;letter-spacing:1.4px;fill:#59636e}
.mono,.pt{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
.mono{font-size:13.5px;fill:#1f2328}.kw{fill:#953800}.fn{fill:#007ead;font-weight:600}.num{fill:#0550ae}
.pt{font-size:11px;fill:#00668c}.pill{fill:#e6f6fc}
.code{fill:#f6f8fa;stroke:#d1d9e0}.bar{fill:#0099cd}
.card{fill:#ffffff;stroke:#d1d9e0;stroke-width:1}
.ib{fill:#e6f6fc}.ic{fill:none;stroke:#0099cd;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.ic .f{fill:#0099cd}.ic .bg{fill:#e6f6fc}
.track{fill:none;stroke:#9fd6ea;stroke-width:2}.tk{stroke:#0099cd;stroke-width:2;fill:none}.ah{fill:#0099cd}
.io{stroke:#8c959f;stroke-width:1.6;fill:none}.ahg{fill:#8c959f}
.ch{fill:#f6f8fa;stroke:#d1d9e0}.cht{font-size:12px;font-weight:600;fill:#1f2328}.chq{fill:#00668c}.cqt{font-size:12px;font-weight:600;fill:#ffffff}
@media (prefers-color-scheme:dark){
text,.mono{fill:#e6edf3}.s,.k{fill:#9198a1}.kw{fill:#ffa657}.fn{fill:#4cc3ec}.num{fill:#79c0ff}
.pt{fill:#8fd8f2}.pill{fill:#0d3446}.code{fill:#151b23;stroke:#3d444d}.bar{fill:#1aa7d9}
.card{fill:#0d1117;stroke:#3d444d}.ib{fill:#0d3446}.ic{stroke:#4cc3ec}.ic .f{fill:#4cc3ec}.ic .bg{fill:#0d3446}
.track{stroke:#1f5a73}.tk{stroke:#4cc3ec}.ah{fill:#4cc3ec}.io{stroke:#656c76}.ahg{fill:#656c76}
.ch{fill:#151b23;stroke:#3d444d}.cht{fill:#e6edf3}.chq{fill:#007ead}.cqt{fill:#ffffff}
}
