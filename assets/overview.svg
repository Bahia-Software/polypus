<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="Polypus overview: your circuit enters the Python API; the Rust core splits shots and optimizer populations across n QPUs and runs them on local simulators (Qiskit Aer, native Rust), on an HPC cluster through CUNQA, or on the QMIO quantum computer"><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.c{text-anchor:middle}.t{font-size:14px;font-weight:600}.h{font-size:17px;font-weight:700;fill:#007ead}
.s{font-size:12px;fill:#59636e}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;fill:#59636e}
.k{font-size:10.5px;font-weight:700;letter-spacing:1.2px;fill:#59636e}.tag{text-anchor:end}
.n{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1.2}.card{fill:#ffffff;stroke:#b6e0f0;stroke-width:1.2}
.brand{fill:#eef8fc;stroke:#0099cd;stroke-width:2}.bar{fill:#cdeefa;stroke:#0099cd;stroke-width:1}
.q1{fill:#0099cd}.q2{fill:#008abb}.q3{fill:#7cc9e6}.q4{fill:#00668c}.w{fill:#ffffff;font-size:12px;font-weight:600}
.qpu{fill:#00668c}.qt{fill:#ffffff}.qs{fill:#d4eef8}.qk{fill:#a8dcf0}
.a{stroke:#8c959f;stroke-width:1.6;fill:none}.ab{stroke:#0099cd;stroke-width:1.6;fill:none}.ah{fill:#8c959f}.abh{fill:#0099cd}
.wire{stroke:#8c959f;stroke-width:1.4}.g{fill:#0099cd}.gs{stroke:#0099cd;stroke-width:1.6;fill:none}
@media (prefers-color-scheme:dark){
text{fill:#e6edf3}.h{fill:#4cc3ec}.s,.m,.k{fill:#9198a1}
.n{fill:#151b23;stroke:#3d444d}.card{fill:#0d1117;stroke:#1f4d63}.brand{fill:#0a2633;stroke:#1aa7d9}.bar{fill:#0d3a4d;stroke:#1aa7d9}
.q3{fill:#2d7f9e}.qpu{fill:#007ead}.qt,.w{fill:#ffffff}.qs{fill:#d4eef8}.qk{fill:#bfe6f5}
.a{stroke:#656c76}.ah{fill:#656c76}.wire{stroke:#656c76}
}
