name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Pull requests: one group per PR, so a new push cancels the run it supersedes.
# Pushes to main and merge-queue groups: one group per run, never cancelled. The release gate
# (release.yml) needs a completed push run for the exact commit it publishes,
# and a shared group would cancel a queued run as soon as a newer one queued.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI only reads the repo; keep the default token read-only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # just runs the checks: each step calls a recipe of the root justfile, which
  # is what `just ci` runs locally (#421). A step runs a command of its own
  # only to install something (tests/docs/test_ci_recipes.py).
  JUST_VERSION: "1.57.0"

# Rust: every job but MSRV, fuzz and Miri uses the toolchain rust-toolchain.toml
# pins; `rustup toolchain install` without a name installs it with the
# components listed there. Those three install the toolchain the justfile
# names and set RUSTUP_TOOLCHAIN to it, which overrides the file in every step
# (and keys the Rust cache on it).
#
# Only `test` reads reference-data/ (about 87 MiB, the polypus-physics tests).
# Every other job checks out without it (#422).
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/reference-data/
          sparse-checkout-cone-mode: false
      - name: reference-data/ is not checked out
        run: test ! -e reference-data
      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - run: just fmt

  # Python lint + formatting (packages, tests, benchmarks, examples).
  # Config lives in [tool.ruff] in the root pyproject.toml.
  ruff:
    name: ruff (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/reference-data/
          sparse-checkout-cone-mode: false
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          # Pin ruff so a new release's changed default rules / formatter output
          # cannot turn CI red without a deliberate bump. Keep in sync with the
          # pin in requirements-dev.txt. The action only installs it; the
          # recipe runs `ruff check` and `ruff format --check`.
          version: "0.16.1"
          args: --version
      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}
      - run: just ruff

  # Security advisories (RustSec), license allowlist and registry sources,
  # per deny.toml. Runs `cargo metadata` only — no build, no Python needed.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/reference-data/
          sparse-checkout-cone-mode: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - name: Install cargo-deny and just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.20.2,just@${{ env.JUST_VERSION }}
      - run: just deny

  # The committed Cargo.lock pins exact dependency versions so a new upstream
  # release cannot silently drift the build (unpinned deps have turned CI red
  # before). This job fails if the lockfile is out of sync with the manifests —
  # a Cargo.toml change that landed without a matching lockfile update.
  # `cargo metadata --locked` resolves the graph against the committed lock and
  # errors if it would need to change; no build, no Python needed.
  lockfile:
    name: Cargo.lock up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/reference-data/
          sparse-checkout-cone-mode: false
      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - name: Verify Cargo.lock is in sync with the manifests
        run: just lockfile

  # Dependencies the workspace declares but never uses add build time and
  # advisory surface. cargo-machete reads the manifests and sources only; a
  # false positive goes in `[package.metadata.cargo-machete] ignored`.
  machete:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/reference-data/
          sparse-checkout-cone-mode: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - name: Install cargo-machete
        run: cargo install --locked cargo-machete@0.9.2
      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}
      - run: just machete

  # The jobs above build against Cargo.lock, which holds the newest versions
  # at the time of the last update, never the floors that the manifests allow
  # (`rand = "0.10"` accepts 0.10.0). Resolve every direct dependency to its
  # declared minimum (`-Z direct-minimal-versions`, nightly-only; transitive
  # dependencies get the lowest versions those allow) and check the build.
  # Raise a floor in the manifest when this fails.
  rust-minimal-versions:
    name: Rust dependency floors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/reference-data/
          sparse-checkout-cone-mode: false
      # PyO3's build script needs a Python interpreter.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}
      # The recipe installs the justfile's nightly for the resolver.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - name: Resolve direct dependencies to their floors
        run: just minimal-versions-resolve
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check (default and optional features)
        run: just minimal-versions-check

  # The Python counterpart: `python-tests` installs the newest release in
  # each declared range. Here the build backend (`[build-system] requires`)
  # and the wheel's `[project] dependencies` resolve to their floors on the
  # floor Python, and the test suite runs against them. Their own
  # dependencies resolve to the newest compatible releases.
  python-floors:
    name: test (Python 3.10, dependency floors)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/reference-data/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      # llvm-as checks that the QIR bitcode export is valid LLVM.
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends llvm
          llvm-as --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install uv
        run: python -m pip install uv==0.13.5
      # `uv build --resolution` does not apply to build requirements, so
      # install them at their floors and build without isolation.
      - name: Install the lowest allowed maturin
        run: |
          uv pip install --system tomli==2.5.0
          python -c 'import tomli; print("\n".join(tomli.load(open("pyproject.toml", "rb"))["build-system"]["requires"]))' > "$RUNNER_TEMP/build-requirements.txt"
          uv pip install --system --resolution lowest-direct -r "$RUNNER_TEMP/build-requirements.txt"
          maturin --version
      - name: Build the wheel with it
        run: just build-wheel --out dist
      # The test requirements (requirements-dev.txt) resolve together with
      # the wheel's, so their floors (pytest, qiskit-qasm3-import) are tested
      # too.
      - name: Install the lowest allowed runtime and test dependencies, then the wheel
        run: |
          uv pip install --system --resolution lowest-direct -r pyproject.toml -r requirements-dev.txt
          uv pip install --system --no-deps dist/polypus_quantum-*.whl
          uv pip list --system
      # A skip outside POLYPUS_ALLOWED_SKIPS fails the run (see the
      # python-tests job). The floors include an older Qiskit than the C-10
      # fixtures' and none of the external optimizer libraries, nor PyTorch.
      - name: Run Python tests
        env:
          POLYPUS_REQUIRE_LLVM_AS: "1"
          POLYPUS_ALLOWED_SKIPS: >-
            test_cunqa_real.py
            test_determinism_baseline.py::TestSameBuildStrict
            test_ask_tell_adapters.py
            test_qasm3_interop.py
            test_torch_quantum_layer.py
            test_typing_stubs.py::TestTorchTypes
            test_typing_stubs.py::TestStubsCoverPublicApi::test_every_exported_name_has_a_stub[polypus.torch]
        run: just pytest

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/reference-data/
          sparse-checkout-cone-mode: false
      # PyO3's build script needs to locate a Python interpreter even for a
      # `cargo check`/clippy build of the `polypus` crate.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Default features only. Do NOT add --all-features here: the `polypus`
      # crate's `extension-module` feature tells PyO3 not to link libpython,
      # which breaks building the test/bench targets that --all-targets compiles.
      - name: Clippy (workspace, default features)
        run: just clippy-workspace
      # Lint the optional QMIO backend (pure Rust: zeromq + serde-pickle). It now
      # lives in `polypus-infrastructure`; lint it there (its own test targets)
      # and through `polypus` (feature forwarding) for the edge conversion.
      - name: Clippy (qmio backend)
        run: just clippy-qmio

  # Guard the declared MSRV (rust-version in Cargo.toml). With the committed
  # Cargo.lock and `--locked`, the exact pinned dependency versions are used, so
  # a new dependency release can no longer raise the effective MSRV or turn this
  # job red without a deliberate lockfile change; bump rust-version deliberately
  # if a required dependency update ever does.
  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/reference-data/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}
      # The MSRV the justfile names, overriding rust-toolchain.toml in every
      # step.
      - name: Install Rust (the justfile's MSRV)
        run: |
          toolchain=$(just --evaluate msrv)
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check (workspace, default features)
        run: just msrv-workspace
      # The qmio feature's own minimum: zeromq 0.7 needs Rust 1.89.
      - name: Check (qmio backend, Rust 1.89)
        run: just msrv-qmio

  # Package every crate and build it from its .crate against the others, as
  # `cargo publish` does on a release tag. A packaging error (a file outside the
  # crate, a dependency without a version, a missing readme or license, a crate
  # that only builds with features another member enables) would otherwise
  # surface mid-publish, with the earlier crates already on crates.io. Needs
  # cargo 1.90+ (not-yet-published workspace versions), which
  # rust-toolchain.toml provides.
  package:
    name: cargo package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/reference-data/
          sparse-checkout-cone-mode: false
      # The PyO3 crates' build scripts need an interpreter.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: cargo package --workspace
        run: just package

  # Compare the public API of every published crate with its latest version on
  # crates.io (cargo-semver-checks). A breaking change needs the next minor
  # while the version is 0.x (`0.8.1-dev` → `0.9.0-dev`, docs/CONTRIBUTING.md);
  # a `-dev` version is judged like its release. Crates not on crates.io yet
  # have no baseline and are skipped. Default features only: the
  # all-features default would enable polypus-logger's mutually exclusive
  # `*-logs` features. A rust-toolchain.toml bump can need a newer
  # cargo-semver-checks (rustdoc JSON format).
  semver:
    name: semver (crates.io API)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/reference-data/
          sparse-checkout-cone-mode: false
      # The PyO3 crates' build scripts need an interpreter.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-semver-checks@0.51.0,just@${{ env.JUST_VERSION }}
      - name: cargo semver-checks (crates on crates.io)
        run: just semver

  test:
    name: test (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The QIR tests that assemble with llvm-as fail without it instead of
      # skipping (LLVM is installed below).
      POLYPUS_REQUIRE_LLVM_AS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PyO3 links libpython at build time, and the PyO3-touching crates' tests
      # start a bare embedded interpreter. No Python package is installed: the
      # Rust tests need no Qiskit/Aer/polypus_python (docs/ENGINEERING.md §3).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      # llvm-as checks that the QIR export is valid LLVM IR.
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends llvm
          llvm-as --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}
      # Every workspace member, with no hand-maintained list: a crate added to
      # the workspace is tested without touching this file. Default features,
      # so `polypus` builds without extension-module (see the clippy note).
      # Cargo unifies features across the members, so this pass compiles e.g.
      # polypus-sim with `parallel`, which `polypus` enables; the steps below
      # cover the other feature sets and profiles. `polypus-subprocess-backend`'s
      # integration tests spawn a Python worker; they resolve `python3`
      # (provided by the setup-python step in this job) and skip gracefully if
      # none is found.
      - name: Test the workspace (default features)
        run: just test-workspace
      # Pure-Rust crates: exercise every feature (includes `parallel` in the sim,
      # whose results must be bit-identical to the sequential path). The one
      # hand-maintained list is `pure_crates` in the justfile:
      # `--workspace --all-features` would enable `polypus`'s extension-module.
      - name: Test pure-Rust crates (all features)
        run: just test-features
      # The memory-safety guards (#342) must hold in the build downstream crates
      # actually get: release *without* overflow-checks (the workspace profile
      # turns them on), with the raw-pointer `parallel` kernels compiled in.
      - name: Test polypus-sim memory safety (release, no overflow-checks)
        run: just test-memory-safety
      # `polypus-logger`'s features are mutually-exclusive log-level selectors
      # (off-logs/error-logs/.../trace-logs, each setting a `log` max_level_*
      # feature), not independent toggles — `--all-features` sets several at
      # once and the `log` crate refuses to compile. The workspace pass builds
      # it with no feature; test it with the wheel's `debug-logs` too.
      - name: Test polypus-logger (debug-logs)
        run: just test-logger
      # The optional QMIO backend lives in `polypus-infrastructure`; `polypus`
      # forwards the feature to it.
      - name: Test the qmio backend (polypus-infrastructure and polypus)
        run: just test-qmio
      # The two backend templates are standalone crates (their own `[workspace]`),
      # so the workspace pass above does not reach them; run each explicitly.
      # Both certify themselves against the conformance battery. The Python one spawns
      # a worker through the subprocess bridge and skips gracefully without an
      # interpreter (setup-python above provides one).
      - name: Test the backend templates
        run: just test-templates

  # Sanity-check that the rustdoc still builds cleanly across the whole
  # workspace (broken intra-doc links fail via -D warnings). Catches
  # doc-comment regressions on PRs. docs.yml builds the same rustdoc into the
  # site and publishes it to Pages (under /rust/) on push to main; the API of
  # each release is on docs.rs.
  docs:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/reference-data/
          sparse-checkout-cone-mode: false
      # PyO3's build script needs a Python interpreter to compile `polypus`.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Build docs (no deploy)
        run: just doc

  # Smoke-test that the PyO3 extension wheel builds on every supported
  # platform, at the floor and latest supported Python (no abi3, so wheels
  # are per-version). The full test suite still runs on Linux only.
  build-extension:
    name: build extension (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/reference-data/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install maturin
        run: python -m pip install --upgrade maturin
      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}
      # Smoke-test that the full distribution wheel builds — the root
      # pyproject.toml drives maturin (the `polypus` extension plus the bundled
      # `polypus_python` helpers). Features come from pyproject `[tool.maturin]`.
      - name: Build wheel
        run: just build-wheel

  # ---------------------------------------------------------------------------
  # Python test suite. Mirrors install.sh and the manual README instructions:
  # install dev deps, then build & install the single `polypus-quantum` wheel
  # (the `polypus` extension plus the bundled `polypus_python` helpers), then run
  # pytest. Runs at the floor and latest supported Python versions with the
  # latest Qiskit, and on 3.12 with the Qiskit that wrote the OpenQASM 3 interop
  # fixtures (contract C-10), whose test skips with any other.
  # ---------------------------------------------------------------------------
  python-tests:
    name: test (Python ${{ matrix.python-version }}${{ matrix.qiskit == 'fixtures' && ', Qiskit of the C-10 fixtures' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        include:
          - python-version: "3.12"
            qiskit: fixtures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/reference-data/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      # llvm-as checks that the QIR bitcode export is valid LLVM.
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends llvm
          llvm-as --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip maturin pytest
          pip install -r requirements-dev.txt
      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}
      # The version tests/python/qasm3_fixtures.py names; the wheel below keeps
      # it, since it satisfies the wheel's own Qiskit requirement.
      - name: Install the Qiskit of the OpenQASM 3 fixtures
        if: matrix.qiskit == 'fixtures'
        working-directory: tests/python
        run: |
          version=$(python -c 'import qasm3_fixtures; print(qasm3_fixtures.QISKIT_VERSION)')
          pip install "qiskit==$version"
      # One wheel now carries both the `polypus` extension and the bundled
      # `polypus_python` helpers (the extension imports `polypus_python` at its
      # execution seams via PyModule::import). Installing the wheel also pulls the
      # runtime deps declared in pyproject.toml (qiskit, qiskit-aer).
      - name: Build & install polypus-quantum (extension + bundled polypus_python)
        run: just wheel
      # The libraries the adapters of polypus.ask_tell wrap, so the tests that
      # train through them (tests/python/test_ask_tell_adapters.py) run here
      # instead of skipping; POLYPUS_REQUIRE_EXTERNAL_LIBRARIES below makes a
      # missing one fail. Pinned, like ruff and mypy, so that a new release
      # cannot turn CI red without a deliberate bump. Latest leg only.
      - name: Install Optuna, Nevergrad and pycma
        if: matrix.python-version == '3.14'
        run: pip install optuna==5.0.0 nevergrad==1.0.12 cma==4.5.0
      # PyTorch for the tests of polypus.torch
      # (tests/python/test_torch_quantum_layer.py); POLYPUS_REQUIRE_TORCH below
      # makes a missing one fail. The CPU wheel, pinned like the libraries
      # above (the floor of the `torch` extra). Latest leg only.
      - name: Install PyTorch (CPU)
        if: matrix.python-version == '3.14'
        run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      # Examples and benchmarks are not executed (no __main__ guards; some
      # need optional deps like cunqa), but they must at least stay valid
      # Python — this catches syntax rot without running them.
      - name: Compile-check examples and benchmarks
        run: just compile-examples
      # -rs lists every skipped test with its reason. The POLYPUS_REQUIRE_*
      # variables turn the skips of tests that back a contract into failures:
      # a missing llvm-as, in the fixtures leg another Qiskit, and in the
      # latest leg a missing Optuna, Nevergrad, pycma or PyTorch. Any other skip
      # fails the run unless POLYPUS_ALLOWED_SKIPS lists it (tests/python/
      # skip_guard.py): the real-CUNQA tests (opt-in), the C-7 tier pinned to
      # the fixture's build (its trainings are compared across two processes
      # instead), and per leg the C-10 fixtures, the external libraries and
      # the PyTorch layer.
      - name: Run Python tests
        env:
          POLYPUS_REQUIRE_LLVM_AS: "1"
          POLYPUS_REQUIRE_FIXTURES_QISKIT: ${{ matrix.qiskit == 'fixtures' && '1' || '' }}
          POLYPUS_REQUIRE_EXTERNAL_LIBRARIES: ${{ matrix.python-version == '3.14' && '1' || '' }}
          POLYPUS_REQUIRE_TORCH: ${{ matrix.python-version == '3.14' && '1' || '' }}
          POLYPUS_ALLOWED_SKIPS: >-
            test_cunqa_real.py
            test_determinism_baseline.py::TestSameBuildStrict
            ${{ matrix.qiskit != 'fixtures' && 'test_qasm3_interop.py' || '' }}
            ${{ matrix.python-version != '3.14' && 'test_ask_tell_adapters.py' || '' }}
            ${{ matrix.python-version != '3.14' && 'test_torch_quantum_layer.py' || '' }}
            ${{ matrix.python-version != '3.14' && 'test_typing_stubs.py::TestTorchTypes' || '' }}
            ${{ matrix.python-version != '3.14' && 'test_typing_stubs.py::TestStubsCoverPublicApi::test_every_exported_name_has_a_stub[polypus.torch]' || '' }}
        run: just pytest
      # The hand-written typing stubs (python/polypus/*.pyi) must match the
      # compiled extension just installed: stubtest fails on a renamed or
      # missing parameter, a changed default or a name the stubs do not declare.
      # mypy comes from requirements-dev.txt, where it is pinned; only the
      # latest leg runs this. The stubs use only `typing`, so they stay valid
      # for 3.10 users. The recipe sets POLYPUS_NO_AUTOCALIBRATE: importing
      # polypus would otherwise calibrate the machine (#176).
      - name: Check typing stubs against the extension (stubtest)
        if: matrix.python-version == '3.14'
        run: just stubtest
      # The conformance battery against the Aer backend
      # (polypus-infrastructure/tests/conformance.rs) needs Qiskit Aer and the
      # wheel's polypus_python, so it is #[ignore]d in the Rust job and runs
      # here, on one OpenMP thread (the recipe sets it).
      - name: Conformance battery against the Aer backend
        if: matrix.python-version == '3.14'
        env:
          POLYPUS_REQUIRE_AER: "1"
        run: just conformance-aer

  # Execute every tutorial notebook headless against this PR's own build, so a
  # broken notebook (a stale API call, a typo introduced while editing) fails
  # the PR instead of only surfacing later, when sync-tutorials.yml executes
  # the same notebooks at release time against the just-published wheel.
  # Mirrors that workflow's execution step (nbconvert --execute), but against
  # the branch's own build on every push/PR instead of only at release.
  tutorials:
    name: tutorials (execute notebooks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/reference-data/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install build tooling
        run: python -m pip install --upgrade pip maturin
      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}
      # Same pattern as the python-tests job: build the full wheel (extension
      # + bundled polypus_python) and install it, which also pulls in the
      # runtime deps declared in pyproject.toml (qiskit, qiskit-aer).
      - name: Build & install polypus-quantum (extension + bundled polypus_python)
        run: just wheel
      # matplotlib is needed only by the tutorials' plots (the histogram in
      # 01_first_circuit and the demo's figures), not by the package itself.
      - name: Install notebook execution dependencies
        run: pip install nbconvert ipykernel matplotlib
      # PyTorch for 07d and the demo's hybrid network (polypus.torch); the
      # same CPU pin as the layer tests, which test_torch_import.py checks.
      - name: Install PyTorch (CPU)
        run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install the python3 Jupyter kernel
        run: python -m ipykernel install --user --name python3 --display-name "Python 3"
      # Headless (the recipe sets MPLBACKEND=Agg).
      - name: Execute every tutorial notebook
        run: just tutorials

  # Fuzz the untrusted OpenQASM 2.0 import surface on a short time budget, as a
  # regression guard for the DoS vectors closed in polypus-circuit (unbounded
  # expression recursion, oversized register declarations, non-finite angles).
  # The OpenQASM 3 importer, and its export round trip, are fuzzed alike.
  # Needs a nightly toolchain and cargo-fuzz; the `fuzz/` crate lives outside
  # the workspace (see the root Cargo.toml `exclude`).
  fuzz:
    name: fuzz (from_qasm2, from_qasm3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/reference-data/
          sparse-checkout-cone-mode: false
      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}
      # The justfile's dated nightly, overriding rust-toolchain.toml in every
      # step. Bump it there, deliberately.
      - name: Install Rust (the justfile's nightly)
        run: |
          toolchain=$(just --evaluate nightly)
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Pinned like the nightly: a newer cargo-fuzz may need a newer Rust.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      # Seeds from the committed corpora (fuzz/corpus/<target>). A crash or
      # OOM fails the job; a clean 60s run per target passes.
      - name: Run libFuzzer on from_qasm2 and from_qasm3 (60s budget each)
        run: just fuzz 60

  # Miri over the `unsafe` in polypus-sim: the raw-pointer rayon kernels
  # (`parallel` feature) and their #342 guards. Reduced test set, since Miri is
  # orders of magnitude slower than native: the kernel unit tests (parallel vs
  # sequential on small registers) and the memory-safety suite, which runs
  # valid and invalid circuits with `parallel_threshold: 0` so every gate takes
  # the parallel path.
  # The recipe's MIRIFLAGS: Tree Borrows, because crossbeam-epoch (under rayon)
  # trips the stricter Stacked Borrows model; isolation off, because the
  # simulator reads the calibration cache and CPU info at construction; leaks
  # ignored, because rayon's global pool threads outlive the test's main thread.
  miri:
    name: miri (polypus-sim)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/reference-data/
          sparse-checkout-cone-mode: false
      - name: Install just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@${{ env.JUST_VERSION }}
      # The justfile's dated nightly, overriding rust-toolchain.toml in every
      # step. Bump it there, deliberately.
      - name: Install Rust (the justfile's nightly, with Miri)
        run: |
          toolchain=$(just --evaluate nightly)
          rustup toolchain install "$toolchain" --profile minimal --component miri,rust-src --no-self-update
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Miri (kernel unit tests and memory-safety suite, parallel)
        run: just miri
