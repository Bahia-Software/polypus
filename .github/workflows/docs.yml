name: Docs

# Build the documentation site (MkDocs) and the rustdoc of the workspace
# crates, and publish them to GitHub Pages: the site at the root, rustdoc under
# /rust/. Nothing is committed; the site is generated here and deployed as a
# Pages artifact. Pull requests run the build only, without deploying.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "python/polypus/**"
      - "tutorials/**"
      - "crates/**"
      - "Cargo.*"
      - "tests/docs/**"
      - "scripts/docs/**"
      - "assets/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "python/polypus/**"
      - "tutorials/**"
      - "crates/**"
      - "Cargo.*"
      - "tests/docs/**"
      - "scripts/docs/**"
      - "assets/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Read-only by default. Only the deploy job gets the OIDC/pages scopes that
# deploy-pages needs; the build job executes PR code and holds no secret.
permissions:
  contents: read

# Serialize Pages deploys; don't cancel an in-flight publish. Pull request
# builds get their own group so they can never displace a queued deploy.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build site and rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PyO3's build script needs to locate a Python interpreter to compile the
      # `polypus` crate (same reason the clippy/test jobs in ci.yml set it up).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # Hook tests first, so a broken hook fails fast; then the strict site build.
      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt
      - name: Test the docs hooks and scripts
        run: pytest tests/docs
      - name: Build site
        run: mkdocs build --strict -d site
      # The toolchain rust-toolchain.toml pins, with its components.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Every workspace crate (`fuzz/` is excluded from the workspace);
      # --no-deps leaves out third-party crates. -D warnings turns broken
      # intra-doc links into build failures instead of silently shipping them.
      - name: Build docs
        run: cargo doc --locked --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"
      # rustdoc goes under /rust/; the old per-crate URLs at the root redirect
      # there.
      - name: Add rustdoc to the site
        run: |
          cp -r target/doc site/rust
          python scripts/docs/write_legacy_redirects.py site
      # Gate: nothing confidential may reach the public, permanent site.
      # The private patterns (same secret and format as hygiene.yml) are only
      # exposed off pull requests; PR builds run the public rules alone.
      - name: Scan the built site
        env:
          HYGIENE_LEAK_PATTERNS: ${{ github.event_name != 'pull_request' && secrets.HYGIENE_LEAK_PATTERNS || '' }}
        run: |
          args=()
          # Off pull requests an unset secret is an error, as in hygiene.yml.
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            args+=(--require-patterns)
          fi
          python scripts/docs/scan_published_site.py site \
            --patterns-env HYGIENE_LEAK_PATTERNS "${args[@]}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1