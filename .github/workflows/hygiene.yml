name: Hygiene

# Blocks internal files, ignored artefacts, infrastructure data, notebooks with
# outputs, oversized blobs, Cargo.toml/CITATION.cff version drift and stale
# internal version pins. Logic and policy live in .github/scripts/hygiene.py,
# .github/scripts/release_check.py and .github/hygiene-allow.txt; changes to
# any of them, or to this file, need human review.
#
# Pull requests run the public rules only. The maintainers' private patterns
# (secret HYGIENE_LEAK_PATTERNS) run after the merge, on the push to main: they
# detect a leak but cannot undo its publication.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Pull requests: one run per PR, superseded runs cancelled. Pushes: one group
# per run, so no push to main is ever left unanalysed.
concurrency:
  group: hygiene-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The PR head itself, not the synthetic merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Test the check (Python 3.10)
        run: |
          python -m pip install pytest==8.3.5
          python -m pytest -p no:cacheprovider -q .github/scripts/test_hygiene.py

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Test the checks (Python 3.11)
        run: |
          python -m pip install pytest==8.3.5
          python -m pytest -p no:cacheprovider -q .github/scripts/test_hygiene.py \
            .github/scripts/test_release_check.py .github/scripts/test_publish_crates.py

      - name: Check (pull request, public rules)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python .github/scripts/hygiene.py
          --base "$BASE_SHA" --head "$HEAD_SHA" --comparison merge-base

      - name: Check (push to main, public and private rules)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          HYGIENE_LEAK_PATTERNS: ${{ secrets.HYGIENE_LEAK_PATTERNS }}
        run: |
          base="$BEFORE_SHA"
          if [ -z "${base//0/}" ]; then
            base=EMPTY  # new branch: no previous tree to compare against
          fi
          python .github/scripts/hygiene.py \
            --base "$base" --head "$HEAD_SHA" --comparison direct \
            --require-leak-patterns

      # The release gate's rules that hold on every branch: an `X.Y.Z` or
      # `X.Y.Z-dev` workspace version, internal pins equal to it, and no
      # `X.Y.Z` that is already tagged. Last, so a failure here never skips
      # the private patterns of a push to main.
      - name: Version and internal pins
        if: ${{ !cancelled() }}
        run: python .github/scripts/release_check.py
