# Build the `polypus-quantum` distribution (the `polypus` PyO3 extension plus the
# bundled `polypus_python` helpers) for every supported platform and publish it
# to PyPI via Trusted Publishing (OIDC — no API tokens stored in the repo).
#
#   • Push a tag `vX.Y.Z`   → build everything and publish to PyPI.
#   • Manual "Run workflow" → build everything; the `target` input picks the index
#                             (testpypi = default dry run, or pypi).
#
# One-time setup on PyPI/TestPyPI (Trusted Publisher, "pending publisher" is fine
# before the first release):
#   Project: polypus-quantum   Owner: Bahia-Software   Repo: polypus
#   Workflow: release.yml
#   Environment: `pypi` for PyPI, `testpypi` for TestPyPI (must match below).
#
# No abi3 is used, so wheels are built per CPython version (3.9–3.13).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        default: testpypi
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  # Linux: manylinux wheels for x86_64 and aarch64. The manylinux container ships
  # CPython 3.9–3.13, so `--find-interpreter` builds all of them in one job.
  linux:
    name: wheels (linux ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # Features come from the root pyproject `[tool.maturin]`; the include
          # rule bundles `polypus_python` into every wheel.
          args: --release --out dist --find-interpreter
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  # macOS: Apple Silicon only (macos-14). GitHub is retiring the Intel `macos-13`
  # runners, which left the Intel jobs queued indefinitely ("waiting for a runner"),
  # so they are dropped — Intel-mac users can build from the sdist. setup-python has
  # no reliable 3.9 on arm64, so macOS wheels are 3.10–3.13.
  macos:
    name: wheels (macos-arm64 py${{ matrix.python-version }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --interpreter python
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-arm64-${{ matrix.python-version }}
          path: dist

  # Windows: x64, per-version wheels.
  windows:
    name: wheels (windows py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --interpreter python
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.python-version }}
          path: dist

  # Source distribution (also carries the bundled polypus_python + vendored crates).
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  # Publish to PyPI on a version tag, or a manual run with target=pypi.
  publish-pypi:
    name: Publish to PyPI
    needs: [linux, macos, windows, sdist]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/polypus-quantum
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  # Manual dry run: publish to TestPyPI (the default target for a manual run).
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [linux, macos, windows, sdist]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/polypus-quantum
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # ── Post-publish clean-room smoke test ──────────────────────────────────────
  # Prove `pip install polypus-quantum` works for someone with NO relation to
  # CESGA: a stock `python:*-slim` container (Debian) has no Rust toolchain, no
  # ZeroMQ/libzmq and none of the CESGA environment. We install straight from
  # PyPI (wheels only, so a self-contained wheel is the only thing that can
  # satisfy it), assert the dependency closure never pulls ZeroMQ or CUNQA, and
  # run a real README example end to end. Runs on every real release; a failure
  # here is the alarm that the published package is broken for outsiders.
  verify-pypi-wheel:
    name: verify wheel from PyPI (py${{ matrix.python }})
    needs: publish-pypi
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Resolve released version from Cargo.toml
        id: ver
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Install from PyPI (wheels only — proves the wheel is self-contained)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eux
          python -m pip install --upgrade pip
          # PyPI's CDN can lag for a few seconds right after publish; retry.
          ok=0
          for i in $(seq 1 20); do
            if pip install --only-binary=:all: --no-cache-dir "polypus-quantum==${VERSION}"; then ok=1; break; fi
            echo "attempt $i: not available yet, waiting for PyPI to propagate…"; sleep 15
          done
          [ "$ok" = 1 ]
          pip show polypus-quantum | grep -E '^(Name|Version|Requires):'
      - name: Assert clean dependency closure (no ZeroMQ, no CUNQA)
        run: |
          set -eux
          python - <<'PY'
          import importlib.util as u
          assert u.find_spec("zmq") is None, "pyzmq leaked into the install"
          assert u.find_spec("cunqa") is None, "cunqa leaked into the install"
          print("dependency closure is clean: no zmq, no cunqa")
          PY
      - name: Run the README Bell example end to end
        run: |
          set -eux
          python - <<'PY'
          import polypus
          bell = polypus.Circuit(2).h(0).cx(0, 1).measure_all()
          result = polypus.run_quantum_circuit(bell, shots=1000, infrastructure="local")
          counts = result.counts[0]
          print("counts:", counts)
          assert sum(counts.values()) == 1000, counts
          assert set(counts) <= {"00", "11"} and {"00", "11"} <= set(counts), counts
          print("Bell example OK")
          PY

  # Same guarantee for the *sdist* — the path Spack and EasyBuild take. They
  # provide a compiler + Rust toolchain (added here via rustup on a full
  # `python:3.11` image, which already ships gcc), but still no ZeroMQ and no
  # CESGA env. `--no-binary polypus-quantum` forces the source build so we prove
  # the sdist compiles the DEFAULT feature set (no `qmio` → no ZeroMQ) and runs.
  verify-pypi-sdist:
    name: verify sdist build from PyPI (Spack/EasyBuild path)
    needs: publish-pypi
    runs-on: ubuntu-latest
    container: python:3.11
    steps:
      - uses: actions/checkout@v7
      - name: Resolve released version from Cargo.toml
        id: ver
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain (what Spack/EasyBuild provide)
        run: |
          set -eux
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build & install from sdist (force source build)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eux
          rustc --version
          python -m pip install --upgrade pip
          ok=0
          for i in $(seq 1 20); do
            if pip install --no-cache-dir --no-binary polypus-quantum "polypus-quantum==${VERSION}"; then ok=1; break; fi
            echo "attempt $i: not available yet, waiting for PyPI to propagate…"; sleep 15
          done
          [ "$ok" = 1 ]
          pip show polypus-quantum | grep -E '^(Name|Version|Requires):'
      - name: No ZeroMQ / no CUNQA, and the Bell example runs
        run: |
          set -eux
          python - <<'PY'
          import importlib.util as u
          assert u.find_spec("zmq") is None, "pyzmq leaked into the sdist build"
          assert u.find_spec("cunqa") is None, "cunqa leaked into the sdist build"
          import polypus
          bell = polypus.Circuit(2).h(0).cx(0, 1).measure_all()
          result = polypus.run_quantum_circuit(bell, shots=1000, infrastructure="local")
          counts = result.counts[0]
          print("counts:", counts)
          assert sum(counts.values()) == 1000, counts
          assert set(counts) <= {"00", "11"} and {"00", "11"} <= set(counts), counts
          print("sdist build + Bell example OK")
          PY
