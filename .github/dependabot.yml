# Weekly update PRs for the GitHub Actions used by CI and for the Rust and
# Python dependencies, grouped into one combined PR per directory and cycle.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One combined PR per weekly cycle instead of one PR per action.
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # This action's tag is the Rust toolchain it installs — our MSRV pin
      # from the workspace Cargo.toml — not a version of the action itself.
      # "Updating" it would make the msrv CI job check a modern Rust instead
      # of the declared minimum. Bump it manually together with rust-version.
      - dependency-name: "dtolnay/rust-toolchain"

  # The workspace and the two templates each commit a Cargo.lock, which CI
  # builds with `--locked`, so none of them picks up new upstream releases on
  # its own. The templates are outside the workspace (see the root Cargo.toml
  # `exclude`), so each directory is listed. `fuzz/` is outside it too, but its
  # Cargo.lock is gitignored (fuzz/.gitignore), so there Dependabot has no pin to
  # refresh: it can only raise a requirement in fuzz/Cargo.toml (e.g.
  # libfuzzer-sys) once a release falls outside it. The `cargo` group is applied
  # per directory: at most one combined PR per directory each week.
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
      - /examples/rust-backend-template
      - /examples/python-backend-template
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"

  # From `/`, Dependabot reads pyproject.toml plus every root-level *.txt whose
  # name contains "requirements", so requirements-dev.txt and
  # requirements-examples.txt are covered without being listed.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip:
        patterns:
          - "*"
    ignore:
      # ruff is pinned twice: requirements-dev.txt for local runs and the
      # `version:` of the ruff-action step in .github/workflows/ci.yml, which
      # Dependabot does not update. Bumping only the requirements file would
      # let local ruff drift from CI's (new rules / formatter output). Bump both
      # by hand, together.
      - dependency-name: "ruff"
