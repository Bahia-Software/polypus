# SonarQube Cloud analysis, run by .github/workflows/sonar.yml. On pull
# requests the scan waits for the quality gate and fails with it
# (sonar.qualitygate.wait, set by the workflow); pushes to main only report.
#
# The organization and project keys must match the ones SonarQube Cloud
# assigned when the repository was imported (Project Information page).
sonar.organization=bahia-software
sonar.projectKey=Bahia-Software_polypus
sonar.projectName=polypus

# Library code: the Rust workspace and the bundled Python packages. Examples,
# benchmarks, tutorials, fuzz targets and reference data are not analysed.
sonar.sources=crates,python
sonar.exclusions=crates/*/tests/**,crates/*/benches/**,crates/*/examples/**,crates/*/assets/**
sonar.tests=crates,tests
sonar.test.inclusions=crates/*/tests/**,crates/*/benches/**,tests/**
sonar.sourceEncoding=UTF-8

sonar.python.version=3.10,3.11,3.12,3.13

# Reports produced by the workflow before the scan. Rust coverage comes from
# the Rust tests (lcov.info) and from the pytest suite run against an
# instrumented wheel (lcov-python.info); Sonar adds up both.
sonar.rust.lcov.reportPaths=lcov.info,lcov-python.info
sonar.rust.clippyReport.reportPaths=clippy.json
sonar.python.coverage.reportPaths=coverage.xml

# The subprocess worker template runs as a separate Python process spawned by
# the Rust integration tests, which no coverage tool instruments, and the
# diagnostic binaries under crates/*/src/bin are run by hand, never by the
# tests. Both are still analysed for issues.
sonar.coverage.exclusions=crates/polypus-subprocess-backend/python/worker_template.py,crates/*/src/bin/**
