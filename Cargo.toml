# Polypus Cargo workspace.
#
# Crates:
#   - crates/polypus-circuit : pure-Rust quantum circuit representation + OpenQASM 2.0 export
#                              (no PyO3, no Python — usable from any Rust project)
#   - crates/polypus-physics : pure-Rust particle-physics layer (classical Monte Carlo
#                              transport + quantum Hamiltonians as Pauli sums; no PyO3)
#   - crates/polypus-sim     : pure-Rust statevector simulator consuming polypus-circuit's
#                              ConcreteCircuit directly (no OpenQASM round-trip; no PyO3)
#   - crates/polypus-optimizers : pure-Rust variational optimizers (DE, PSO, QNG) decoupled
#                              from circuits and Python via EvaluationOracle/VarianceOracle
#   - crates/polypus-logger  : pure-Rust logging sink (a `log::Log` implementation) shared by
#                              the whole workspace; libraries emit via the `log` facade, only
#                              the app layer installs it (no PyO3)
#   - crates/polypus         : the Polypus library and Python extension module (PyO3)
[workspace]
members = ["crates/polypus", "crates/polypus-circuit", "crates/polypus-physics", "crates/polypus-sim", "crates/polypus-optimizers", "crates/polypus-observable", "crates/polypus-infrastructure", "crates/polypus-scheduler", "crates/polypus-logger"]
# The `fuzz/` crate is a cargo-fuzz target: it needs a nightly toolchain and
# `cargo-fuzz`, and is built on its own — never by `cargo build/test --workspace`.
exclude = ["fuzz"]
resolver = "2"

# Shared package metadata, inherited by member crates via `<key>.workspace = true`.
[workspace.package]
version = "0.6.0"
edition = "2021"
# MSRV, guarded by the `msrv` CI job. Currently set by the dependency tree
# (the qmio feature pulls `saa`, which uses edition 2024 → Cargo 1.85); the
# workspace's own code needs far less. Bump deliberately when a dep requires it.
rust-version = "1.85"
authors = ["Diego Beltran Fernandez Prada <diego.fernandez@bahiasoftware.es>", "Victor Soñora Pombo", "Sergio Figueiras Gomez", "Miguel Boubeta Martinez", "Galicia Supercomputing Center (CESGA)"]
# SPDX identifier (required by cargo-deny and crates.io). The full licence
# text, including the "or subsequent versions approved by the European
# Commission" clause, lives in the LICENSE file at the repo root.
license = "EUPL-1.2"

[workspace.dependencies]
polypus-circuit    = { path = "crates/polypus-circuit", version = "0.6.0" }
polypus-physics    = { path = "crates/polypus-physics", version = "0.6.0" }
polypus-sim        = { path = "crates/polypus-sim", version = "0.6.0" }
polypus-optimizers = { path = "crates/polypus-optimizers", version = "0.6.0" }
polypus-observable = { path = "crates/polypus-observable", version = "0.6.0" }
polypus-infrastructure = { path = "crates/polypus-infrastructure", version = "0.6.0" }
polypus-scheduler  = { path = "crates/polypus-scheduler", version = "0.6.0" }
polypus-logger     = { path = "crates/polypus-logger", version = "0.6.0" }

# Shared external dependencies pinned once for the whole workspace.
# `log` is the logging facade every crate emits through; the concrete sink lives
# in `polypus-logger`, which additionally enables its `std` feature.
log                = "0.4"
# UUID v4 for run-id uniqueness (bindings layer); `v4` pulls the RNG feature.
uuid               = { version = "1", features = ["v4"] }
# RNG shared by `polypus` and `polypus-optimizers`; keep default features.
rand               = "0.8"

# Release profile posture — set explicitly rather than left to Cargo's defaults.
#
# Memory safety must not depend on a debug build. Qubit-index and operand
# validation is enforced by real `Result`-returning checks
# (`polypus_sim::Statevector::apply` + `polypus_circuit::qubit_index_violation`),
# never by the statevector kernels' `debug_assert!`s — so `debug-assertions`
# stays off in release, keeping those hot kernels at full speed. `overflow-checks`
# is turned ON: shot-count and index arithmetic must trap on overflow rather than
# silently wrap, in release as well as debug (the kernels' index math is bitwise,
# so this does not touch their inner loops).
[profile.release]
overflow-checks = true
debug-assertions = false
