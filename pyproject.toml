[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
# PyPI distribution name. The import name stays `polypus` (see
# `[tool.maturin] module-name` below) — the name `polypus` on PyPI is taken by
# an unrelated project, so the distribution is published as `polypus-quantum`.
name = "polypus-quantum"
description = "Distributed quantum computing — Rust core, Python bindings, one API across simulators and real QPUs."
readme = "README.md"
# Floor set by the runtime deps of the bundled `polypus_python` helpers
# (qiskit>=2.0 needs >=3.9). CI tests the floor and the latest supported version.
requires-python = ">=3.9"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [
    { name = "Diego Beltrán Fernández Prada", email = "diego.fernandez@bahiasoftware.es" },
    { name = "Víctor Soñora Pombo" },
    { name = "Sergio Figueiras Gómez" },
    { name = "Miguel Boubeta Martínez" },
    { name = "Galicia Supercomputing Center (CESGA)" },
]
keywords = ["quantum", "quantum-computing", "vqc", "qml", "qaoa", "qiskit", "simulator", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
# Runtime deps of the bundled `polypus_python` helpers (Qiskit/Aer execution
# seam). The Rust core needs none of these, but the wheel ships the helpers, so
# they are declared here.
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
    'importlib-metadata; python_version<"3.10"',
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Bahia-Software/polypus"
Repository = "https://github.com/Bahia-Software/polypus"
Documentation = "https://bahia-software.github.io/polypus/"
Issues = "https://github.com/Bahia-Software/polypus/issues"
# Cross-reference to the Rust side: this wheel imports as `polypus`, and the same
# project is published on crates.io as the `polypus` crate (`cargo add polypus`).
"Rust crate (crates.io)" = "https://crates.io/crates/polypus"

[tool.maturin]
features = ["extension-module"]
# The repo is a Cargo workspace; the PyO3 extension crate lives here.
manifest-path = "crates/polypus/Cargo.toml"
# Keep the import name `polypus` even though the distribution is `polypus-quantum`
# (matches the crate's `[lib] name` and the `#[pymodule] fn polypus`). Without
# this, maturin would expect the module to be `polypus_quantum` and `import
# polypus` would break.
module-name = "polypus"
# Mixed Rust/Python layout: ship a hand-written `polypus/__init__.py` instead of
# the wrapper maturin auto-generates. It re-exports the extension unchanged and
# adds lazy auto-calibration of the gate-parallel threshold at import (issue
# #176), so `pip install polypus-quantum` users — who have no `install.sh`
# post-install hook — get a machine-tuned threshold with no manual step. With a
# python source root present, maturin places the compiled extension at
# `polypus/polypus*.so` next to that `__init__.py`, which does `from .polypus
# import *` exactly as the generated wrapper did.
python-source = "python"
# Bundle the pure-Python helper package into the same wheel as a real top-level
# `polypus_python` package. The extension imports it by that name at its
# execution seams (`PyModule::import(py, "polypus_python")`), and users import
# `polypus_python.qaoa_utils` etc. directly, so it must be a real top-level
# package (not a `polypus` submodule or a sys.modules alias). No `format` key =>
# included in BOTH the wheel and the sdist, so a build from the sdist (e.g. PyPI's
# fallback when there is no matching wheel) still ships the helpers.
include = ["polypus_python/**/*.py"]

# Python lint + formatting for the whole repo (packages, tests, benchmarks,
# examples). CI runs `ruff check` and `ruff format --check`.
[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Pin the rule set explicitly (pycodestyle errors E4/E7/E9 + pyflakes F, plus
# import sorting I). Using an explicit `select` instead of `extend-select` stops
# a newer ruff's expanded default `select` from silently enforcing rules the
# project has not adopted (which turned CI red on an unpinned ruff-action). The
# ruff version is pinned in CI (.github/workflows/ci.yml) and requirements-dev.txt.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Package roots re-export their public API.
"**/__init__.py" = ["F401"]
# Tests import qiskit after a pytest.importorskip guard.
"tests/**" = ["E402"]

[tool.ruff.lint.isort]
# `polypus_python/` now lives at the repo root, so ruff's isort would otherwise
# auto-classify it as first-party and split it from `polypus` (the compiled
# extension, classified third-party) in the files that import both. Pin it
# third-party so the two stay in one import section, exactly as before the
# packaging move (`polypus` needs no pin — it has no root source dir).
known-third-party = ["polypus_python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
    "integration: tests that execute real quantum circuits (require AerSimulator)",
    "vqc: tests that train variational quantum circuits (slow)",
]
