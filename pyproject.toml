[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "polypus"
# Floor set by the runtime deps of polypus_python (qiskit>=2.0 needs >=3.9).
# CI tests the floor and the latest supported version.
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
[tool.maturin]
features = ["extension-module"]
# The repo is a Cargo workspace; the PyO3 extension crate lives here.
manifest-path = "crates/polypus/Cargo.toml"

# Python lint + formatting for the whole repo (packages, tests, benchmarks,
# examples). CI runs `ruff check` and `ruff format --check`.
[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Pin the rule set explicitly (pycodestyle errors E4/E7/E9 + pyflakes F, plus
# import sorting I). Using an explicit `select` instead of `extend-select` stops
# a newer ruff's expanded default `select` from silently enforcing rules the
# project has not adopted (which turned CI red on an unpinned ruff-action). The
# ruff version is pinned in CI (.github/workflows/ci.yml) and requirements-dev.txt.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Package roots re-export their public API.
"**/__init__.py" = ["F401"]
# Tests import qiskit after a pytest.importorskip guard.
"tests/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
    "integration: tests that execute real quantum circuits (require AerSimulator)",
    "vqc: tests that train variational quantum circuits (slow)",
]
